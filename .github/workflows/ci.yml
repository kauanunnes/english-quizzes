# docs/13 §13.7, adaptado para Next.js (ADR-014)
name: ci

on:
  pull_request:
  push:
    # O repositório usa master; main fica para o caso de renomear o branch
    branches: [master, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # Ambiente de teste/CI (§13.4): nada externo, banco em memória
      MOCK_UPSTREAMS: '1'
      OS_MODE: mock
      LLM_PROVIDER: fake
      DATABASE_URL: pglite://memory
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test --coverage
      # Inclui o check-bundle
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium webkit
      - run: pnpm e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
